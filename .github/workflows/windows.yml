name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

permissions: {}

concurrency:
  group: windows-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  windows-matrix:
    name: Generate Windows build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        # Pinned to the 1.8.1 commit SHA (CR-002): mutable @v1 is a
        # supply-chain risk for a workflow that has contents:write on the
        # release job. The comment names the release, not the floating tag;
        # `v1` moves on every upstream bump, which leaves a `# v1` comment
        # stale and fails the zizmor pin audit. Bump via dependabot.
        uses: php/php-windows-builder/extension-matrix@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          extension-url: ${{ github.event.repository.html_url }}
          php-version-list: '8.2, 8.3, 8.4, 8.5'

  windows-build:
    name: Build ${{ matrix.php-version }} ${{ matrix.arch }} ${{ matrix.ts }}
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build extension
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php-version }}
          ts: ${{ matrix.ts }}
          arch: ${{ matrix.arch }}
          args: --enable-mdparser

      - name: Setup PHP for smoke test
        if: matrix.arch == 'x64'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php-version }}
          phpts: ${{ matrix.ts }}
          coverage: none
          tools: none

      - name: Smoke-test built DLL
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          # The builder zips the renamed DLL into artifacts/ with no path
          # output, so unpack the top-level zip and load the DLL directly,
          # mirroring scripts/build-release-binary.sh.
          rm -rf smoke && mkdir smoke
          unzip -q artifacts/*.zip -d smoke
          dlls=(smoke/php_mdparser*.dll)
          dll="${dlls[0]}"
          [ -f "$dll" ] || { echo "::error::No built DLL in artifacts/"; exit 1; }
          php -n -d "extension=$dll" -r '
          $version = phpversion("mdparser");
          if (!is_string($version) || $version === "") {
              fwrite(STDERR, "version check failed\n");
              exit(1);
          }
          $parser = new MdParser\Parser();
          if ($parser->toHtml("# Release") !== "<h1>Release</h1>\n") {
              fwrite(STDERR, "HTML smoke test failed\n");
              exit(1);
          }
          $ast = $parser->toAst("a &amp; b");
          if ($ast["type"] !== "document") {
              fwrite(STDERR, "AST smoke test failed\n");
              exit(1);
          }
          '
  release:
    name: Attach Windows DLLs to release
    if: github.event_name == 'release'
    needs: windows-build
    runs-on: ubuntu-latest
    # Explicit write scope for releases; default GITHUB_TOKEN is read-only
    # for the contents permission on newly-created repos and the
    # php-windows-builder/release@v1 action calls POST /releases.
    permissions:
      contents: write # Uploads Windows binaries to the published release.
    steps:
      # Pinned to the commit SHA that v6 resolves to; this job runs
      # under contents:write, so a moved tag on a third-party action
      # would inherit the release-write token. persist-credentials:
      # false drops the GITHUB_TOKEN from the local git config so any
      # shell step in the workflow cannot reuse it for an unrelated
      # push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload release artifacts
        uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
