name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

permissions: {}

concurrency:
  group: windows-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  windows-matrix:
    name: Generate Windows build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        # Pinned to the 1.8.1 commit SHA (CR-002): mutable @v1 is a
        # supply-chain risk for a workflow that has contents:write on the
        # release job. The comment names the release, not the floating tag;
        # `v1` moves on every upstream bump, which leaves a `# v1` comment
        # stale and fails the zizmor pin audit. Bump via dependabot.
        uses: php/php-windows-builder/extension-matrix@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # 1.8.1
        with:
          extension-url: ${{ github.event.repository.html_url }}
          php-version-list: '8.2, 8.3, 8.4, 8.5'

  windows-build:
    name: Build ${{ matrix.php-version }} ${{ matrix.arch }} ${{ matrix.ts }}
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build extension
        uses: php/php-windows-builder/extension@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # 1.8.1
        with:
          php-version: ${{ matrix.php-version }}
          ts: ${{ matrix.ts }}
          arch: ${{ matrix.arch }}
          args: --enable-mdparser

  release:
    name: Attach Windows DLLs to release
    if: github.event_name == 'release'
    needs: windows-build
    runs-on: ubuntu-latest
    # Explicit write scope for releases; default GITHUB_TOKEN is read-only
    # for the contents permission on newly-created repos and the
    # php-windows-builder/release@v1 action calls POST /releases.
    permissions:
      contents: write # Uploads Windows binaries to the published release.
    steps:
      # Pinned to the commit SHA that v6 resolves to; this job runs
      # under contents:write, so a moved tag on a third-party action
      # would inherit the release-write token. persist-credentials:
      # false drops the GITHUB_TOKEN from the local git config so any
      # shell step in the workflow cannot reuse it for an unrelated
      # push.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Upload release artifacts
        uses: php/php-windows-builder/release@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # 1.8.1
        with:
          release: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
