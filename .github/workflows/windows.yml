name: Windows Build

# Push and PR runs build and test one x64 lane per MSVC toolset (vs16: 8.2,
# vs17: 8.4, vs18: 8.6) in TS and NTS. The release event, the weekly schedule,
# and workflow_dispatch build and test every shipped combination, x86 and PHP
# 8.3/8.5 included; only the release event uploads. Dispatch it on the release
# commit before tagging so a break in a lane push CI skips fails before the
# all-or-nothing upload job would ship zero Windows assets.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 2'

permissions: {}

concurrency:
  # The event name keeps a scheduled or dispatched full-matrix run on master
  # out of the push group, so a push does not cancel it.
  group: windows-${{ github.event_name }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  windows-matrix:
    name: Generate Windows build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        # Pinned to a commit SHA because the release job has contents:write.
        # The trailing comment names the release, not the floating `v1` tag,
        # which would go stale and fail the zizmor pin audit. Bump via
        # dependabot.
        uses: php/php-windows-builder/extension-matrix@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          extension-url: ${{ github.event.repository.html_url }}
          php-version-list: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '8.2, 8.4, 8.6' || '8.2, 8.3, 8.4, 8.5, 8.6' }}
          arch-list: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'x64' || 'x64, x86' }}
          ts-list: 'nts, ts'

  windows-build:
    name: Build ${{ matrix.php-version }} ${{ matrix.arch }} ${{ matrix.ts }}
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build extension
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php-version }}
          ts: ${{ matrix.ts }}
          arch: ${{ matrix.arch }}
          args: --enable-mdparser

      - name: Setup PHP for smoke test
        # setup-php ships NTS only, which matches the NTS lanes exactly.
        # TS-packaged zips are covered by the builder's in-build suite;
        # a TS php.exe is not obtainable from setup-php (no TS selector).
        if: matrix.arch == 'x64' && matrix.ts == 'nts'
        # setup-php main until a release marks PHP 8.6 stable; return to a tagged release then.
        uses: shivammathur/setup-php@2001cd3148dcbaf467b7fa06cd7155ebb6d4cacf # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none
        env:
          # The DLL is built against the newest patch's dev pack; a runner's
          # older preinstalled PHP can lack symbols it imports.
          update: true

      - name: Smoke-test built DLL
        if: matrix.arch == 'x64' && matrix.ts == 'nts'
        shell: bash
        run: |
          set -euo pipefail
          # The builder zips the renamed DLL into artifacts/ with no path
          # output, so unpack the top-level zip and load the DLL directly,
          # mirroring scripts/build-release-binary.sh.
          rm -rf smoke && mkdir smoke
          unzip -q artifacts/*.zip -d smoke
          dlls=(smoke/php_mdparser*.dll)
          dll="${dlls[0]}"
          [ -f "$dll" ] || { echo "::error::No built DLL in artifacts/"; exit 1; }
          php -n -d "extension=$dll" -r '
          $version = phpversion("mdparser");
          if (!is_string($version) || $version === "") {
              fwrite(STDERR, "version check failed\n");
              exit(1);
          }
          $parser = new MdParser\Parser();
          if ($parser->toHtml("# Release") !== "<h1>Release</h1>\n") {
              fwrite(STDERR, "HTML smoke test failed\n");
              exit(1);
          }
          $ast = $parser->toAst("a &amp; b");
          if ($ast["type"] !== "document") {
              fwrite(STDERR, "AST smoke test failed\n");
              exit(1);
          }
          '
  release:
    name: Attach Windows DLLs to release
    if: github.event_name == 'release'
    needs: windows-build
    runs-on: ubuntu-latest
    # Explicit write scope for releases; default GITHUB_TOKEN is read-only
    # for the contents permission on newly-created repos and the
    # php-windows-builder/release@v1 action calls POST /releases.
    permissions:
      contents: write # Uploads Windows binaries to the published release.
    steps:
      # SHA-pinned because this job has contents:write and a moved tag
      # would inherit the release-write token. persist-credentials: false
      # keeps GITHUB_TOKEN out of the local git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload release artifacts
        uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
