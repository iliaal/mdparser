name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: composer validate --strict

  pie-smoke:
    name: PIE install smoke
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none
      - name: Install PIE build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison libtool-bin
      - name: Download PIE
        run: |
          curl -fsSL -o /tmp/pie.phar https://github.com/php/pie/releases/latest/download/pie.phar
          chmod +x /tmp/pie.phar
      - name: PIE build smoke
        run: |
          php /tmp/pie.phar repository:add path .
          php /tmp/pie.phar build iliaal/mdparser:*@dev

  linux:
    name: PHP ${{ matrix.php }} - Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Build extension
        run: |
          set -o pipefail
          phpize
          ./configure --enable-mdparser --enable-mdparser-dev
          WARNINGS=$(make -j$(nproc) 2>&1 | tee /dev/stderr | grep -c 'warning:' || true)
          if [ "$WARNINGS" -gt 0 ]; then
            echo "::error::Build produced $WARNINGS warning(s)"
            exit 1
          fi

      - name: Run tests
        run: |
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/mdparser.so"
          export NO_INTERACTION=1
          set +e
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/ 2>&1 | tee /tmp/mdparser-phpt.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          # 077 skips without ASAN_OPTIONS; expect exactly that one skip.
          scripts/check-phpt-result.sh /tmp/mdparser-phpt.txt "$STATUS" 1

  linux-zts:
    name: PHP ${{ matrix.php }} ZTS - Linux (canary)
    runs-on: ubuntu-latest
    # setup-php offers no thread-safety selector (its input set is
    # php-version/extensions/ini-*/coverage/tools only) and an env-level
    # PHPTS is silently ignored, so a setup-php lane can never be a ZTS
    # canary. Build a real ZTS PHP from source instead (same shape as the
    # asan job, without sanitizers). Full default extensions, so the skip
    # budget matches the other lanes.
    env:
      PHP_VERSION: ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build PHP with ZTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends autoconf bison re2c
          git clone --depth=1 --branch="PHP-${PHP_VERSION}" https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          ./configure --enable-zts --prefix=/tmp/php-zts
          make -j$(nproc)
          make install

      - name: Assert ZTS PHP
        run: "/tmp/php-zts/bin/php -r 'exit(PHP_ZTS ? 0 : 1);'"

      - name: Build extension under ZTS
        run: |
          export PATH="/tmp/php-zts/bin:$PATH"
          phpize
          ./configure --enable-mdparser --with-php-config=/tmp/php-zts/bin/php-config
          make -j$(nproc)

      - name: Run tests under ZTS
        run: |
          export TEST_PHP_EXECUTABLE=/tmp/php-zts/bin/php
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/mdparser.so"
          export NO_INTERACTION=1
          set +e
          /tmp/php-zts/bin/php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/ 2>&1 | tee /tmp/mdparser-phpt.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          # Full default extensions, so the skip budget matches the other lanes.
          scripts/check-phpt-result.sh /tmp/mdparser-phpt.txt "$STATUS" 1

  macos:
    name: PHP ${{ matrix.php }} - macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the PHP set release-linux.yml ships prebuilt macOS binaries
        # for (8.4, 8.5); a version built at release time but never built here
        # would first fail on the release runner, after the tag is live.
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Build extension
        run: |
          phpize
          ./configure --enable-mdparser
          make -j$(sysctl -n hw.ncpu)

      - name: Run tests
        run: |
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/mdparser.so"
          export NO_INTERACTION=1
          set +e
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/ 2>&1 | tee /tmp/mdparser-phpt.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          # 077 skips without ASAN_OPTIONS; expect exactly that one skip.
          scripts/check-phpt-result.sh /tmp/mdparser-phpt.txt "$STATUS" 1

  asan:
    name: PHP ${{ matrix.php }} - ASAN
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    env:
      # detect_leaks=1 pinned explicitly. LSan's default is on under
      # Linux ASan; pinning prevents a future ASAN_OPTIONS edit from
      # silently flipping it. Narrow known-good leaks (vendored
      # MINIT singletons etc.) go in .github/lsan-suppressions.txt;
      # prefer that over blanket detect_leaks=0. See
      # ~/ai/wiki/debugging/asan-php-extension.md.
      ASAN_OPTIONS: exitcode=139:verify_asan_link_order=0:detect_odr_violation=0:detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt:print_suppressions=0
      UBSAN_OPTIONS: print_stacktrace=1
      USE_ZEND_ALLOC: 0
      USE_TRACKED_ALLOC: 1
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm clang re2c bison autoconf

      - name: Build PHP with ASAN
        run: |
          git clone --depth=1 --branch="PHP-${PHP_VERSION}" https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined" \
          ./configure \
            --enable-debug \
            --enable-zts \
            --disable-all \
            --enable-cli \
            --prefix=/tmp/php-asan
          make -j$(nproc)
          make install

      - name: Build extension with ASAN
        run: |
          export PATH="/tmp/php-asan/bin:$PATH"
          phpize
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined" \
          ./configure \
            --enable-mdparser \
            --with-php-config=/tmp/php-asan/bin/php-config
          make -j$(nproc)

      - name: Run tests under ASAN
        run: |
          export TEST_PHP_EXECUTABLE=/tmp/php-asan/bin/php
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/mdparser.so"
          export NO_INTERACTION=1
          set +e
          /tmp/php-asan/bin/php run-tests.php --show-diff --asan -g FAIL,BORK,LEAK,XLEAK tests/ 2>&1 | tee /tmp/mdparser-phpt.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          # 069 needs ext-dom, missing from the --disable-all build; expect that one skip.
          scripts/check-phpt-result.sh /tmp/mdparser-phpt.txt "$STATUS" 1

  oom-sweep:
    name: OOM sweep (vendored md4c)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc

      - name: Compile OOM sweep
        run: |
          gcc -g -O0 -fsanitize=address,undefined -I vendor/md4c \
            -o /tmp/oom_sweep tests/oom/oom_sweep.c vendor/md4c/entity.c

      - name: Run OOM sweep
        run: |
          bin=/tmp/oom_sweep
          status=0
          for doc in tests/oom/corpus/*.md; do
            total="$("$bin" "$doc" -1 | sed -n 's/.*allocs=\([0-9]*\).*/\1/p')"
            if [ -z "$total" ] || [ "$total" -eq 0 ]; then
              echo "FAIL $(basename "$doc"): baseline parse allocated nothing to sweep"
              status=1
              continue
            fi
            bad=0
            set +e
            for n in $(seq 1 "$total"); do
              out="$("$bin" "$doc" "$n" 2>&1)"
              rc=$?
              if printf '%s' "$out" | grep -q 'ERROR: \(Address\|Leak\)Sanitizer'; then
                bad=$((bad + 1))
                echo "  $(basename "$doc") fail_at=$n -> $(printf '%s' "$out" | grep -m1 'ERROR:')"
              elif [ "$rc" -ne 0 ]; then
                bad=$((bad + 1))
                echo "  $(basename "$doc") fail_at=$n -> $(printf '%s' "$out" | tail -1)"
              fi
            done
            set -e
            if [ "$bad" -eq 0 ]; then
              echo "PASS $(basename "$doc") ($total allocation points)"
            else
              echo "FAIL $(basename "$doc") ($bad of $total allocation points)"
              status=1
            fi
          done
          exit "$status"
