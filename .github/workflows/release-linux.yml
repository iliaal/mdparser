name: Release Linux & macOS binaries

# Triggered when a GitHub Release is published. Builds .so binaries for
# Linux glibc (x86_64 + arm64) at PHP 8.4, 8.5, and 8.6 and macOS arm64 at
# PHP 8.4 and 8.5 (NTS only, ZTS lives in the Windows lane), uploads each
# as a release asset with PIE's pre-packaged-binary naming convention.
# Each archive is unpacked and loaded before it is uploaded to the release.
#
# 8.3 is absent: PIE's composer-default fallback
# source-builds for any PHP version not covered by a prebuilt, so 8.3
# users still get an install path; it just requires a build toolchain.
# Drop the 8.4 lane when 8.4 hits actual EOL.
#
# macOS Intel (macos-13) is absent: GitHub's Intel runner
# pool is too contended to ship reliably (jobs queue 30+ min on busy
# days, blocking release closeout), and macOS 26 drops Intel support
# anyway. Intel-Mac users source-build via PIE's composer-default
# fallback, same path PHP 8.3 users already take.
#
# macOS PHP 8.6 is absent: macOS 8.6 users source-build via PIE's
# composer-default fallback.
#
# The Docker official php:8.6 images are thread-safe by design
# (docker-library/php#1686) and have no NTS variant, so the Linux 8.6 lane
# builds NTS PHP from the checksum-pinned php.net tarball inside the
# digest-pinned debian:bookworm-slim image, the base of the other versions'
# php images, and commits it as a local image for the build and smoke steps.
#
# Linux musl (Alpine) is absent: shivammathur/setup-php
# in Alpine containers needs more setup, and Alpine users get install
# via PIE's composer-default source-build fallback in the meantime.
#
# composer.json declares
#   "download-url-method": ["pre-packaged-binary", "composer-default"]
# in the php-ext block, so PIE prefers the prebuilt asset and falls
# back to source-build when no asset matches.
#
# Third-party actions are pinned to commit SHAs because this job has
# contents:write, and a moved tag would inherit the release-write token.
#
# Each binary compiles against a pinned NEWEST patch release of its PHP
# minor (8.4.28, 8.5.13, 8.6.0), so it carries the memory_limit stop behind
# ZEND_HAS_OOM. Those headers make the module import symbols that earlier
# patches do not export, so the binaries require 8.4.28+ / 8.5.13+ / 8.6.0+.
# On an older patch the extension refuses to start with a warning (MINIT
# compares php_version_id() against the build's PHP_VERSION_ID) instead of
# dying with "undefined symbol" on first use. Linux builds inside the
# digest-pinned php image (8.6: the source-built NTS image); macOS builds
# PHP from the checksum-pinned php.net release tarball, so a later patch
# release cannot raise the floor without a repo diff.
#
# Before upload, every binary must load and grow a 64 KiB+ output on the
# build patch, every Linux import must be exported by that patch's php
# binary or its libraries, and a Linux binary must refuse to start, not
# crash, on the oldest patch of its minor (8.4.1, as 8.4.0 was never
# released, and 8.5.0). While the build patch is the first release of its
# minor (8.6.0), no older patch exists and that gate is skipped; a matrix
# entry whose build patch is not X.Y.0 must name an oldest image.

on:
  release:
    types: [published]
  # Manual trigger to (re)build and upload prebuilt binaries for an
  # existing release: recovery when a lane flaked. With release-tag left
  # empty, it builds the dispatched ref and runs every gate without
  # uploading, for pre-tag validation on a branch.
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing release tag to build and upload binaries for (empty: build and test the dispatched ref without uploading)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-linux-${{ github.event.release.tag_name || inputs.release-tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Uploads tested binaries to the selected release.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (x86_64), ubuntu-24.04-arm (arm64),
        # macos-15 (Apple Silicon arm64). Pinned over `*-latest` to
        # avoid silent runner shifts that would change the toolchain /
        # glibc baseline on published release assets without a repo
        # diff.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
        php: ['8.4', '8.5', '8.6']
        exclude:
          - os: macos-15
            php: '8.6'
        # The image digests are multi-arch indexes; ghcr.io/iliaal/php and
        # the ECR copy of the Docker official image serve the same digests
        # as Docker Hub, so the pull step tries GHCR first and falls back to
        # ECR and Docker Hub when a registry rate-limits.
        #
        # The newest patch (newest-image on Linux, the newest-version
        # tarball on macOS and for Linux 8.6) produces the shipped binary
        # and sets its PHP floor; bumping it raises that floor. Keep
        # newest-version equal to the newest-image patch. The oldest-patch
        # image is the gate that the binary refuses to start below the floor.
        include:
          - php: '8.4'
            newest-version: '8.4.28'
            newest-source-sha256: 0c8ec360e5dd8154f270b2fd50cd44ecc824e6ee39c85f911312b80d4daecd72
            oldest-image: public.ecr.aws/docker/library/php:8.4.1-cli-bookworm@sha256:246d2ca7e9cf21c4e7c354ce87e87bf1ad6d41b2061c77668845e04a8f8889d4
            newest-image: public.ecr.aws/docker/library/php:8.4.28-cli-bookworm@sha256:85da896b3eeb8bcd83fe612e51a529b7d5983a1fab92ef5f63c7ac6e2842fc46
          - php: '8.5'
            newest-version: '8.5.13'
            newest-source-sha256: 607602acaf0c3061818e9916ec44a058e8b3d43959a83862b9cd3ec7bf5b785f
            oldest-image: public.ecr.aws/docker/library/php:8.5.0-cli-bookworm@sha256:4ff93cd1b053c4d5ff468ced40962092a350a8c86798fee96e807bc9b383ec75
            newest-image: public.ecr.aws/docker/library/php:8.5.13-cli-bookworm@sha256:d6991172c4282d2a09d6418073923a81664173bb0a0e07a16663a9a645746092
          - php: '8.6'
            newest-version: '8.6.0'
            newest-source-sha256: 5f84beaa3d763aee1e4feed99bf54ec692c383b322e25626807b589238c3a087
            base-image: public.ecr.aws/docker/library/debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
      PHP_MINOR: ${{ matrix.php }}
      OLDEST_IMAGE: ${{ matrix.oldest-image }}
      NEWEST_IMAGE: ${{ matrix.newest-image }}
      NEWEST_VERSION: ${{ matrix.newest-version }}
      NEWEST_SOURCE_SHA256: ${{ matrix.newest-source-sha256 }}
      BASE_IMAGE: ${{ matrix.base-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release-tag || github.sha }}

      - name: Verify release source
        if: env.RELEASE_TAG != ''
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          test -n "${TAG_COMMIT}"
          test "$(git rev-parse HEAD)" = "${TAG_COMMIT}"
          scripts/check_version.sh

      - name: Resolve build version
        id: version
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            version="${RELEASE_TAG}"
          else
            version=$(sed -n 's/^#define PHP_MDPARSER_VERSION "\([^"]*\)"/\1/p' php_mdparser.h)
          fi
          test -n "${version}"
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

      - name: Pull pinned PHP images or build NTS PHP images (Linux)
        id: images
        if: runner.os == 'Linux'
        env:
          # Matches PHPIZE_DEPS in the Docker official php images.
          PHPIZE_DEPS: autoconf dpkg-dev file g++ gcc libc-dev make pkg-config re2c
        run: |
          pull_pinned() {
            local ecr_ref="${1}" attempt candidate
            local path="${ecr_ref#public.ecr.aws/docker/library/}"
            local ghcr_ref="ghcr.io/iliaal/${path}"
            local hub_ref="docker.io/library/${path}"
            if [[ "${ecr_ref}" != *@sha256:* ]]; then
              printf 'ERROR: %s is not pinned by digest\n' "${ecr_ref}" >&2
              return 1
            fi
            for attempt in 1 2 3; do
              for candidate in "${ghcr_ref}" "${ecr_ref}" "${hub_ref}"; do
                if docker pull -q "${candidate}" >&2; then
                  printf '%s\n' "${candidate}"
                  return 0
                fi
              done
              sleep $((attempt * 60))
            done
            printf 'ERROR: could not pull %s from GHCR, ECR, or Docker Hub\n' "${ecr_ref}" >&2
            return 1
          }
          build_nts() {
            local version="${1}" sha256="${2}" base="${3}"
            local ref="mdparser-php:${version}-nts"
            local tarball="${RUNNER_TEMP}/php-${version}.tar.xz"
            if docker image inspect "${ref}" >/dev/null 2>&1; then
              printf '%s\n' "${ref}"
              return 0
            fi
            curl -fsSL --retry 3 -o "${tarball}" \
              "https://www.php.net/distributions/php-${version}.tar.xz"
            printf '%s  %s\n' "${sha256}" "${tarball}" | sha256sum -c - >&2
            rm -rf "${RUNNER_TEMP}/php-${version}"
            tar -xJf "${tarball}" -C "${RUNNER_TEMP}"
            docker rm -f php-nts-build >/dev/null 2>&1 || true
            # CFLAGS, CPPFLAGS, and LDFLAGS match the Docker official php images.
            docker run --name php-nts-build \
              -v "${RUNNER_TEMP}/php-${version}:/php-src" -w /php-src \
              -e PHPIZE_DEPS -e PHP_VERSION="${version}" \
              "${base}" \
              bash -euo pipefail -c '
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends ${PHPIZE_DEPS} >/dev/null
                export CFLAGS="-fstack-protector-strong -fpic -fpie -O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
                export CPPFLAGS="${CFLAGS}" LDFLAGS="-Wl,-O1 -pie"
                ./configure --prefix=/usr/local \
                  --disable-all --enable-cli --disable-cgi --disable-phpdbg >/dev/null
                make -j"$(nproc)" >/dev/null
                make install >/dev/null
                test "$(php -n -r "echo PHP_VERSION;")" = "${PHP_VERSION}"
                php -n -r "exit(PHP_ZTS ? 1 : 0);"
              ' >&2
            docker commit --change "ENV PHPIZE_DEPS=\"${PHPIZE_DEPS}\"" \
              php-nts-build "${ref}" >/dev/null
            docker rm php-nts-build >/dev/null
            printf '%s\n' "${ref}"
          }
          if [[ -n "${BASE_IMAGE}" ]]; then
            base=$(pull_pinned "${BASE_IMAGE}")
            newest=$(build_nts "${NEWEST_VERSION}" "${NEWEST_SOURCE_SHA256}" "${base}")
          else
            newest=$(pull_pinned "${NEWEST_IMAGE}")
          fi
          oldest=""
          if [[ -n "${OLDEST_IMAGE}" ]]; then
            oldest=$(pull_pinned "${OLDEST_IMAGE}")
          elif [[ "${NEWEST_VERSION}" != *.*.0 ]]; then
            printf 'ERROR: no oldest-patch image for PHP %s\n' "${NEWEST_VERSION}" >&2
            exit 1
          fi
          printf 'oldest=%s\nnewest=%s\n' "${oldest}" "${newest}" >>"${GITHUB_OUTPUT}"

      - name: Build, package, and test prebuilt binary on the newest patch (Linux)
        id: package-linux
        if: runner.os == 'Linux'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          PULLED_NEWEST_IMAGE: ${{ steps.images.outputs.newest }}
        run: |
          docker run --rm \
            -v "${PWD}:/src" -w /src \
            -v "${GITHUB_OUTPUT}:/github-output" -e GITHUB_OUTPUT=/github-output \
            -e BUILD_VERSION -e NEWEST_VERSION \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "${PULLED_NEWEST_IMAGE}" \
            bash -euo pipefail -c '
              trap '\''chown -R "${HOST_UID}:${HOST_GID}" /src /github-output'\'' EXIT
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends ${PHPIZE_DEPS} zip unzip >/dev/null
              test "$(/usr/local/bin/php -n -r "echo PHP_VERSION;")" = "${NEWEST_VERSION}"
              /usr/local/bin/php -n -r "exit(PHP_ZTS ? 1 : 0);"
              scripts/build-release-binary.sh "${BUILD_VERSION}"
              scripts/check-release-abi.sh modules/mdparser.so /usr/local/bin/php
            '

      - name: Build newest-patch PHP from source (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix="${RUNNER_TEMP}/php-${NEWEST_VERSION}"
          tarball="${RUNNER_TEMP}/php-${NEWEST_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o "${tarball}" \
            "https://www.php.net/distributions/php-${NEWEST_VERSION}.tar.xz"
          printf '%s  %s\n' "${NEWEST_SOURCE_SHA256}" "${tarball}" | shasum -a 256 -c -
          tar -xJf "${tarball}" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/php-${NEWEST_VERSION}"
          ./configure --prefix="${prefix}" \
            --disable-all --enable-cli --disable-cgi --disable-phpdbg
          make -j"$(sysctl -n hw.ncpu)"
          make install
          test "$("${prefix}/bin/php" -n -r 'echo PHP_VERSION;')" = "${NEWEST_VERSION}"
          printf 'NEWEST_PREFIX=%s\n' "${prefix}" >>"${GITHUB_ENV}"
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - name: Build, package, and test prebuilt binary on the newest patch (macOS)
        id: package-macos
        if: runner.os == 'macOS'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          # The macOS asset targets macOS 14 as its minimum.
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          # phpize needs autoconf, which the runner image does not ship.
          brew install autoconf
          PHPIZE="${NEWEST_PREFIX}/bin/phpize" \
            PHP_CONFIG="${NEWEST_PREFIX}/bin/php-config" \
            PHP_BIN="${NEWEST_PREFIX}/bin/php" \
            scripts/build-release-binary.sh "${BUILD_VERSION}"

      - name: Smoke test on the newest patch, refuse the oldest
        id: package
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_PATH: ${{ steps.package-linux.outputs.package-path || steps.package-macos.outputs.package-path }}
          PULLED_OLDEST_IMAGE: ${{ steps.images.outputs.oldest }}
          PULLED_NEWEST_IMAGE: ${{ steps.images.outputs.newest }}
        run: |
          test -n "${PACKAGE_PATH}"
          if [[ "${RUNNER_OS}" == Linux ]]; then
            targets=("image=${PULLED_NEWEST_IMAGE}")
            if [[ -n "${PULLED_OLDEST_IMAGE}" ]]; then
              targets+=("refuse-image=${PULLED_OLDEST_IMAGE}")
            fi
          else
            targets=("php=${NEWEST_PREFIX}/bin/php")
          fi
          scripts/smoke-release-binary.sh "${PACKAGE_PATH}" "${BUILD_VERSION}" \
            "${PHP_MINOR}" "${targets[@]}"
          printf 'package-path=%s\n' "${PACKAGE_PATH}" >>"${GITHUB_OUTPUT}"

      - name: Upload tested prebuilt binary
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_PATH: ${{ steps.package.outputs.package-path }}
        run: gh release upload "${RELEASE_TAG}" "${PACKAGE_PATH}" --clobber
