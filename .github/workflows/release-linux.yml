name: Release Linux & macOS binaries

# Triggered when a GitHub Release is published. Builds .so binaries for
# Linux glibc (x86_64 + arm64) and macOS arm64 at PHP 8.4 and 8.5 (NTS
# only, ZTS lives in the Windows lane), uploads each as a release asset
# with PIE's pre-packaged-binary naming convention. Each archive is unpacked
# and loaded before it is uploaded to the release.
#
# 8.3 is intentionally absent: PIE's composer-default fallback
# source-builds for any PHP version not covered by a prebuilt, so 8.3
# users still get an install path; it just requires a build toolchain.
# Drop the 8.4 lane when 8.4 hits actual EOL.
#
# macOS Intel (macos-13) is intentionally absent: GitHub's Intel runner
# pool is too contended to ship reliably (jobs queue 30+ min on busy
# days, blocking release closeout), and macOS 26 drops Intel support
# anyway. Intel-Mac users source-build via PIE's composer-default
# fallback, same path PHP 8.3 users already take.
#
# Linux musl (Alpine) is intentionally absent: shivammathur/setup-php
# in Alpine containers needs more setup, and Alpine users get install
# via PIE's composer-default source-build fallback in the meantime.
#
# composer.json declares
#   "download-url-method": ["pre-packaged-binary", "composer-default"]
# in the php-ext block, so PIE prefers the prebuilt asset and falls
# back to source-build when no asset matches.
#
# Third-party actions are pinned to commit SHAs because this job has
# contents:write -- a moved tag would inherit the release-write token.

on:
  release:
    types: [published]
  # Manual trigger to (re)build and upload prebuilt binaries for an
  # existing release -- recovery when a lane flaked, or pre-tag build
  # validation on a throwaway branch (the build still runs; the upload
  # targets whatever release-tag is given).
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing release tag to build and upload binaries for"
        required: true

permissions: {}

concurrency:
  group: release-linux-${{ github.event.release.tag_name || inputs.release-tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Uploads tested binaries to the selected release.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (x86_64), ubuntu-24.04-arm (arm64),
        # macos-14 (Apple Silicon arm64). Pinned over `*-latest` to
        # avoid silent runner shifts that would change the toolchain /
        # glibc baseline on published release assets without a repo
        # diff.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release-tag }}

      - name: Verify release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          test -n "${TAG_COMMIT}"
          test "$(git rev-parse HEAD)" = "${TAG_COMMIT}"
          scripts/check_version.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Build, package, and test prebuilt binary
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: scripts/build-release-binary.sh "${RELEASE_TAG}"

      - name: Upload tested prebuilt binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.package-path }}
        run: gh release upload "${RELEASE_TAG}" "${PACKAGE_PATH}" --clobber
