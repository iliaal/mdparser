name: Release Linux & macOS binaries

# Triggered when a GitHub Release is published. Builds .so binaries for
# Linux glibc (x86_64 + arm64) and macOS arm64 at PHP 8.4 and 8.5 (NTS
# only, ZTS lives in the Windows lane), uploads each as a release asset
# with PIE's pre-packaged-binary naming convention. Each archive is unpacked
# and loaded before it is uploaded to the release.
#
# 8.3 is absent: PIE's composer-default fallback
# source-builds for any PHP version not covered by a prebuilt, so 8.3
# users still get an install path; it just requires a build toolchain.
# Drop the 8.4 lane when 8.4 hits actual EOL.
#
# macOS Intel (macos-13) is absent: GitHub's Intel runner
# pool is too contended to ship reliably (jobs queue 30+ min on busy
# days, blocking release closeout), and macOS 26 drops Intel support
# anyway. Intel-Mac users source-build via PIE's composer-default
# fallback, same path PHP 8.3 users already take.
#
# Linux musl (Alpine) is absent: shivammathur/setup-php
# in Alpine containers needs more setup, and Alpine users get install
# via PIE's composer-default source-build fallback in the meantime.
#
# composer.json declares
#   "download-url-method": ["pre-packaged-binary", "composer-default"]
# in the php-ext block, so PIE prefers the prebuilt asset and falls
# back to source-build when no asset matches.
#
# Third-party actions are pinned to commit SHAs because this job has
# contents:write, and a moved tag would inherit the release-write token.
#
# Each binary is compiled against the oldest patch release of its PHP minor
# (8.4.1, as 8.4.0 was never released, and 8.5.0): Linux inside the
# digest-pinned php image, macOS against php-src built from the
# checksum-pinned php.net tarball. Headers from a newer patch can select
# engine APIs added mid-series, such as the fallible allocators behind
# ZEND_HAS_OOM, and the binary then fails on earlier patches with an
# undefined symbol. Before upload, every binary must load and grow a
# 64 KiB+ output on both the oldest and the newest patch, and each Linux
# import must be exported by the oldest patch's php binary or its libraries.
# Bump the newest-image digests when a new patch ships.

on:
  release:
    types: [published]
  # Manual trigger to (re)build and upload prebuilt binaries for an
  # existing release: recovery when a lane flaked. With release-tag left
  # empty, it builds the dispatched ref and runs every gate without
  # uploading, for pre-tag validation on a branch.
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing release tag to build and upload binaries for (empty: build and test the dispatched ref without uploading)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-linux-${{ github.event.release.tag_name || inputs.release-tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Uploads tested binaries to the selected release.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (x86_64), ubuntu-24.04-arm (arm64),
        # macos-15 (Apple Silicon arm64). Pinned over `*-latest` to
        # avoid silent runner shifts that would change the toolchain /
        # glibc baseline on published release assets without a repo
        # diff.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
        php: ['8.4', '8.5']
        # The image digests are multi-arch indexes; the ECR copy of the
        # Docker official image serves the same digests as Docker Hub, so
        # the pull step falls back to Docker Hub when ECR rate-limits.
        include:
          - php: '8.4'
            oldest-version: '8.4.1'
            oldest-source-sha256: 94c8a4fd419d45748951fa6d73bd55f6bdf0adaefb8814880a67baa66027311f
            oldest-image: public.ecr.aws/docker/library/php:8.4.1-cli-bookworm@sha256:246d2ca7e9cf21c4e7c354ce87e87bf1ad6d41b2061c77668845e04a8f8889d4
            newest-image: public.ecr.aws/docker/library/php:8.4.27-cli-bookworm@sha256:496b5e02fe9fe44fcfb715023b931048111dc4e0bc719789d83c906be9f04b05
          - php: '8.5'
            oldest-version: '8.5.0'
            oldest-source-sha256: 39cb6e4acd679b574d3d3276f148213e935fc25f90403eb84fb1b836a806ef1e
            oldest-image: public.ecr.aws/docker/library/php:8.5.0-cli-bookworm@sha256:4ff93cd1b053c4d5ff468ced40962092a350a8c86798fee96e807bc9b383ec75
            newest-image: public.ecr.aws/docker/library/php:8.5.12-cli-bookworm@sha256:d4f6e10eb393de7e3a7a88e8b88e139072dd3ae297f6a5dada8257e6fe32c585
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
      PHP_MINOR: ${{ matrix.php }}
      OLDEST_VERSION: ${{ matrix.oldest-version }}
      OLDEST_SOURCE_SHA256: ${{ matrix.oldest-source-sha256 }}
      OLDEST_IMAGE: ${{ matrix.oldest-image }}
      NEWEST_IMAGE: ${{ matrix.newest-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release-tag || github.sha }}

      - name: Verify release source
        if: env.RELEASE_TAG != ''
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          test -n "${TAG_COMMIT}"
          test "$(git rev-parse HEAD)" = "${TAG_COMMIT}"
          scripts/check_version.sh

      - name: Resolve build version
        id: version
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            version="${RELEASE_TAG}"
          else
            version=$(sed -n 's/^#define PHP_MDPARSER_VERSION "\([^"]*\)"/\1/p' php_mdparser.h)
          fi
          test -n "${version}"
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

      - name: Pull pinned PHP images (Linux)
        id: images
        if: runner.os == 'Linux'
        run: |
          pull_pinned() {
            local ecr_ref="${1}" attempt candidate
            local hub_ref="docker.io/library/${ecr_ref#public.ecr.aws/docker/library/}"
            for attempt in 1 2 3; do
              for candidate in "${ecr_ref}" "${hub_ref}"; do
                if docker pull -q "${candidate}" >&2; then
                  printf '%s\n' "${candidate}"
                  return 0
                fi
              done
              sleep $((attempt * 60))
            done
            printf 'ERROR: could not pull %s from ECR or Docker Hub\n' "${ecr_ref}" >&2
            return 1
          }
          oldest=$(pull_pinned "${OLDEST_IMAGE}")
          newest=$(pull_pinned "${NEWEST_IMAGE}")
          printf 'oldest=%s\nnewest=%s\n' "${oldest}" "${newest}" >>"${GITHUB_OUTPUT}"

      - name: Build, package, and test prebuilt binary on the oldest patch (Linux)
        id: package-linux
        if: runner.os == 'Linux'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          PULLED_OLDEST_IMAGE: ${{ steps.images.outputs.oldest }}
        run: |
          docker run --rm \
            -v "${PWD}:/src" -w /src \
            -v "${GITHUB_OUTPUT}:/github-output" -e GITHUB_OUTPUT=/github-output \
            -e BUILD_VERSION -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "${PULLED_OLDEST_IMAGE}" \
            bash -euo pipefail -c '
              trap '\''chown -R "${HOST_UID}:${HOST_GID}" /src /github-output'\'' EXIT
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends ${PHPIZE_DEPS} zip unzip >/dev/null
              scripts/build-release-binary.sh "${BUILD_VERSION}"
              scripts/check-release-abi.sh modules/mdparser.so /usr/local/bin/php
            '

      - name: Build oldest-patch PHP from source (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix="${RUNNER_TEMP}/php-${OLDEST_VERSION}"
          tarball="${RUNNER_TEMP}/php-${OLDEST_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o "${tarball}" \
            "https://www.php.net/distributions/php-${OLDEST_VERSION}.tar.xz"
          printf '%s  %s\n' "${OLDEST_SOURCE_SHA256}" "${tarball}" | shasum -a 256 -c -
          tar -xJf "${tarball}" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/php-${OLDEST_VERSION}"
          ./configure --prefix="${prefix}" \
            --disable-all --enable-cli --disable-cgi --disable-phpdbg
          make -j"$(sysctl -n hw.ncpu)"
          make install
          test "$("${prefix}/bin/php" -n -r 'echo PHP_VERSION;')" = "${OLDEST_VERSION}"
          printf 'OLDEST_PREFIX=%s\n' "${prefix}" >>"${GITHUB_ENV}"
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - name: Setup newest-patch PHP (macOS)
        if: runner.os == 'macOS'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Build, package, and test prebuilt binary on the oldest patch (macOS)
        id: package-macos
        if: runner.os == 'macOS'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          # Builds on macos-15 because setup-php's Homebrew install hangs on
          # macos-14 runners; the macOS asset still targets macOS 14 as its
          # minimum.
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          PHPIZE="${OLDEST_PREFIX}/bin/phpize" \
            PHP_CONFIG="${OLDEST_PREFIX}/bin/php-config" \
            PHP_BIN="${OLDEST_PREFIX}/bin/php" \
            scripts/build-release-binary.sh "${BUILD_VERSION}"

      - name: Smoke test on the oldest and newest patch
        id: package
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_PATH: ${{ steps.package-linux.outputs.package-path || steps.package-macos.outputs.package-path }}
          PULLED_OLDEST_IMAGE: ${{ steps.images.outputs.oldest }}
          PULLED_NEWEST_IMAGE: ${{ steps.images.outputs.newest }}
        run: |
          test -n "${PACKAGE_PATH}"
          if [[ "${RUNNER_OS}" == Linux ]]; then
            targets=("image=${PULLED_OLDEST_IMAGE}" "image=${PULLED_NEWEST_IMAGE}")
          else
            newest_php=$(command -v php)
            test "${newest_php}" != "${OLDEST_PREFIX}/bin/php"
            targets=("php=${OLDEST_PREFIX}/bin/php" "php=${newest_php}")
          fi
          scripts/smoke-release-binary.sh "${PACKAGE_PATH}" "${BUILD_VERSION}" \
            "${PHP_MINOR}" "${targets[@]}"
          printf 'package-path=%s\n' "${PACKAGE_PATH}" >>"${GITHUB_OUTPUT}"

      - name: Upload tested prebuilt binary
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_PATH: ${{ steps.package.outputs.package-path }}
        run: gh release upload "${RELEASE_TAG}" "${PACKAGE_PATH}" --clobber
