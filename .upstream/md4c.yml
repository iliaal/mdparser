note: |
  md4c (mity/md4c), vendored at master 10c0158 (MDPARSER_MD4C_VERSION =
  0.5.3+git10c0158). The vendor directory mirrors a commit rather than a
  release tag, so the gate resolves the branch head. mity/md4c publishes
  tags but no GitHub Releases, so `resolver: github` hit releases/latest,
  404'd on every run, and degraded to warn-and-proceed without ever
  comparing anything.

  Carries one local behavior patch (NUL replacement in
  md_text_with_null_replacement) plus the MD_PARSER_BAILOUT_GUARD embedding
  hook in md_parse. See vendor/VENDOR.md. The code-span trailing-whitespace
  patch was accepted upstream as 10e96ad4 and dropped in the 2026-07-27
  refresh.
