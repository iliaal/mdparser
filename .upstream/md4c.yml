note: |
  md4c (mity/md4c), vendored at master c7ba975 (MDPARSER_MD4C_VERSION =
  0.6.0+gitc7ba975, tag v0.6.0 plus 8 commits). The vendor directory mirrors
  a commit rather than a release tag, so the gate resolves the branch head.
  mity/md4c publishes tags but no GitHub Releases, so `resolver: github` hit
  releases/latest, 404'd on every run, and degraded to warn-and-proceed
  without ever comparing anything.

  Carries eight local behavior patches, two performance patches, and two
  embedding hooks: MD_PARSER_BAILOUT_GUARD in md_parse and raw attribute
  source provenance in MD_ATTRIBUTE/md_build_attribute. NUL replacement in
  md_text_with_null_replacement, the table column-count guard in
  md_is_table_underline, the "||"-only spoiler length test in
  md_analyze_marks (upstream c933a91 dropped it, so with spoilers and wiki
  links both on a single '|' paired up, vanished, and unbalanced spoiler
  spans), suppression of inline marks in consumed full-reference link labels,
  the linked block-quote lookup used by blank-line container analysis, and
  the two-comparison byte test in md_is_link_destination_B (proposed upstream
  as mity/md4c#443, open). See vendor/VENDOR.md.
  The footnote definition patch emits definitions through a pointer queue,
  including nested-only references, so label hash buckets retain their original
  targets during footnote rendering.
  The failed footnote-probe patch delays widening a '[' opener over '^' until
  a footnote definition is found, preserving ordinary links on lookup failure.
  The HTML block start patch checks the terminator after type 1 tag names,
  excludes self-closing type 1 tags from type 7, and keeps scanning type 6
  names after a shorter prefix fails its terminator test.
  The list-item blank-line patch records each LI opener boundary and whether
  the item had source content, so a final MD_LINE or consumed reference
  definition cannot make a nonempty item appear empty.

  The 2026-09-29 refresh from 61f5ce7 dropped six local patches that
  upstream now carries: the five out-of-memory error-path fixes (b630227,
  fa0efb8, 47f8f4c) and the cached memchr end-of-line scan, superseded by
  upstream's bounded-lookahead memchr scan (a25ed43 + 11e0b30,
  mity/md4c#442). Earlier, the code-span trailing-whitespace patch was
  accepted upstream as 10e96ad4 and dropped in the 2026-07-27 refresh.
  md4c-html.c is not compiled in.
