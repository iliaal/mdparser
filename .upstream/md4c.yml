note: |
  md4c (mity/md4c), vendored at master f9e5eb23 (MDPARSER_MD4C_VERSION =
  0.6.0+gitf9e5eb23, tag v0.6.0 plus 46 commits). The vendor directory mirrors
  a commit rather than a release tag, so the gate resolves the branch head.
  mity/md4c publishes tags but no GitHub Releases, so `resolver: github` hit
  releases/latest, 404'd on every run, and degraded to warn-and-proceed
  without ever comparing anything.

  Carries two local behavior patches and two embedding hooks: NUL
  replacement in md_text_with_null_replacement, the table column-count guard
  in md_is_table_underline, MD_PARSER_BAILOUT_GUARD in md_parse, and raw
  attribute source provenance in MD_ATTRIBUTE/md_build_attribute. See
  vendor/VENDOR.md.

  The 2026-10-26 refresh from 58c55b69 dropped six local patches that
  upstream now carries. Upstream e2c6766 (full-reference label marks),
  f353ad6 (footnote definition order), ae821cb (failed footnote probes),
  e313f46 (HTML block start tag boundaries), and 205b7f7 + 157e9fc + 60e8065
  (list-item closure after two blank lines) match the local patches line for
  line apart from comments. Upstream ff1cd9f + be8a0fe (GHSA-582f-rcwc-x4mp)
  replace the linked block-quote lookup in blank-line container analysis
  with a cached range of implicit list parents; tests/091 passes on it.
  Other upstream changes rework the permissive autolink URL tail (f895c2b,
  1645761, 6240bca, 775e87e) and bound its rescans (f9e5eb2, mity/md4c#464).

  The 2026-10-13 refresh dropped the local "||"-only spoiler length test
  (upstream 89a9bf4) and the link-destination two-comparison byte test
  (upstream 45ec7ac and ec89a39). The 2026-09-29 refresh from 61f5ce7 dropped
  six local patches that upstream now carries: the five out-of-memory
  error-path fixes (b630227, fa0efb8, 47f8f4c) and the cached memchr
  end-of-line scan, superseded by upstream's bounded-lookahead memchr scan
  (a25ed43 + 11e0b30, mity/md4c#442). Earlier, the code-span
  trailing-whitespace patch was accepted upstream as 10e96ad4 and dropped in
  the 2026-07-27 refresh. md4c-html.c is not compiled in.
